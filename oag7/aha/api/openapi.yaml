openapi: 3.0.3
info:
  contact:
    name: Grokify
    url: https://github.com/grokify/aha-go
  description: |
    Go client for the Aha.io product management API.

    This OpenAPI specification is used to generate the internal API client
    via ogen. The public SDK provides ergonomic wrappers on top of the
    generated client.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Aha.io API
  version: 1.0.0
servers:
- description: Aha.io API server
  url: "https://{subdomain}.aha.io/api/v1"
  variables:
    subdomain:
      default: secure
      description: Your Aha account subdomain
security:
- bearerAuth: []
tags:
- description: Comment management
  name: Comments
- description: Epic management
  name: Epics
- description: Feature management
  name: Features
- description: Goal management
  name: Goals
- description: Idea management
  name: Ideas
- description: Initiative management
  name: Initiatives
- description: Product (workspace) management
  name: Products
- description: Release management
  name: Releases
- description: Requirement management
  name: Requirements
- description: Strategic model management (canvases)
  name: StrategicModels
- description: User management
  name: Users
- description: Workflow and status management
  name: Workflows
paths:
  /features:
    get:
      description: Get all features with optional filtering
      operationId: listFeatures
      parameters:
      - description: Sub-string to match against feature name or ID
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: UTC timestamp (ISO8601). Only features updated after this time.
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by tag value
        explode: true
        in: query
        name: tag
        required: false
        schema:
          type: string
        style: form
      - description: Filter by assigned user ID or email
        explode: true
        in: query
        name: assigned_to_user
        required: false
        schema:
          type: string
        style: form
      - description: Page number
        explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Results per page
        explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesResponse"
          description: A list of features
      summary: List features
      tags:
      - Features
  /features/{feature_id}:
    get:
      description: Get a specific feature by ID or reference number
      operationId: getFeature
      parameters:
      - description: "Numeric ID or reference number (e.g., PROD-123)"
        explode: false
        in: path
        name: feature_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"
          description: Feature details
        "404":
          description: Feature not found
      summary: Get feature
      tags:
      - Features
    put:
      description: Update an existing feature
      operationId: updateFeature
      parameters:
      - description: Numeric ID or reference number
        explode: false
        in: path
        name: feature_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"
          description: Updated feature
      summary: Update feature
      tags:
      - Features
  /releases/{release_id}/features:
    get:
      description: Get all features for a specific release
      operationId: listReleaseFeatures
      parameters:
      - description: Release ID or reference number
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturesResponse"
          description: A list of features in the release
      summary: List features in release
      tags:
      - Features
    post:
      description: Create a new feature in a release
      operationId: createReleaseFeature
      parameters:
      - description: Release ID or reference number
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureResponse"
          description: Created feature
      summary: Create feature in release
      tags:
      - Features
  /epics:
    get:
      description: Get all epics with optional filtering
      operationId: listEpics
      parameters:
      - description: Sub-string to match against epic name
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: UTC timestamp (ISO8601). Only epics updated after this time.
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicsResponse"
          description: A list of epics
      summary: List epics
      tags:
      - Epics
  /epics/{epic_id}:
    get:
      description: Get a specific epic by ID or reference number
      operationId: getEpic
      parameters:
      - description: Epic ID or reference number
        explode: false
        in: path
        name: epic_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicResponse"
          description: Epic details
        "404":
          description: Epic not found
      summary: Get epic
      tags:
      - Epics
    put:
      description: Update an existing epic
      operationId: updateEpic
      parameters:
      - description: Epic ID or reference number
        explode: false
        in: path
        name: epic_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpicUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicResponse"
          description: Updated epic
      summary: Update epic
      tags:
      - Epics
  /products/{product_id}/epics:
    get:
      description: Get all epics for a product
      operationId: listProductEpics
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicsResponse"
          description: A list of epics
      summary: List product epics
      tags:
      - Epics
  /releases/{release_id}/epics:
    post:
      description: Create a new epic in a release
      operationId: createReleaseEpic
      parameters:
      - description: Release ID or reference number
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpicCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpicResponse"
          description: Created epic
      summary: Create epic in release
      tags:
      - Epics
  /ideas:
    get:
      description: Get all ideas with optional filtering
      operationId: listIdeas
      parameters:
      - description: Search term to match against idea name
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: "When true, shows ideas marked as spam"
        explode: true
        in: query
        name: spam
        required: false
        schema:
          type: boolean
        style: form
      - description: Filter by workflow status ID or name
        explode: true
        in: query
        name: workflow_status
        required: false
        schema:
          type: string
        style: form
      - description: Sort order
        explode: true
        in: query
        name: sort
        required: false
        schema:
          enum:
          - recent
          - trending
          - popular
          type: string
        style: form
      - description: UTC timestamp (ISO8601). Only ideas created before this time.
        explode: true
        in: query
        name: created_before
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: UTC timestamp (ISO8601). Only ideas created after this time.
        explode: true
        in: query
        name: created_since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: UTC timestamp (ISO8601). Only ideas updated after this time.
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by tag value
        explode: true
        in: query
        name: tag
        required: false
        schema:
          type: string
        style: form
      - description: Filter by creator user ID
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          type: string
        style: form
      - description: Filter by idea user ID
        explode: true
        in: query
        name: idea_user_id
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Comma-separated list of additional idea fields to include in\
          \ each list item (e.g. \"votes,categories,score\"). Aha's list endpoint\
          \ omits these by default; passing this parameter overrides Aha's default\
          \ field set rather than adding to it."
        explode: true
        in: query
        name: fields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeasResponse"
          description: A list of ideas
      summary: List ideas
      tags:
      - Ideas
  /ideas/{idea_id}:
    delete:
      description: Delete an idea by ID
      operationId: deleteIdea
      parameters:
      - description: Idea ID or reference number
        explode: false
        in: path
        name: idea_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Idea deleted successfully
      summary: Delete idea
      tags:
      - Ideas
    get:
      description: Get a specific idea by ID
      operationId: getIdea
      parameters:
      - description: Idea ID or reference number
        explode: false
        in: path
        name: idea_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
          description: Idea details
      summary: Get idea
      tags:
      - Ideas
    put:
      description: Update an existing idea
      operationId: updateIdea
      parameters:
      - description: Idea ID or reference number
        explode: false
        in: path
        name: idea_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdeaUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaResponse"
          description: Updated idea
      summary: Update idea
      tags:
      - Ideas
  /products/{product_id}/idea_categories:
    get:
      description: Get all idea categories for a product
      operationId: listProductIdeaCategories
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdeaCategoriesResponse"
          description: A list of idea categories
      summary: List idea categories
      tags:
      - Ideas
  /products:
    get:
      description: Get all products (workspaces) including Aha! Develop teams
      operationId: listProducts
      parameters:
      - description: UTC timestamp (ISO8601). Only products updated after this time.
        explode: true
        in: query
        name: updated_since
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Set to true to list only products with idea portals
        explode: true
        in: query
        name: with_idea_portals
        required: false
        schema:
          type: boolean
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsResponse"
          description: A list of products
      summary: List products
      tags:
      - Products
    post:
      description: Create a new product or product line
      operationId: createProduct
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
          description: Created product
      summary: Create product
      tags:
      - Products
  /products/{product_id}:
    get:
      description: Get a specific product by ID
      operationId: getProduct
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
          description: Product details
      summary: Get product
      tags:
      - Products
    put:
      description: Update an existing product
      operationId: updateProduct
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
          description: Updated product
      summary: Update product
      tags:
      - Products
  /products/{product_id}/releases:
    get:
      description: Get all releases for a product
      operationId: listProductReleases
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleasesResponse"
          description: A list of releases
      summary: List product releases
      tags:
      - Releases
    post:
      description: Create a new release for a product
      operationId: createRelease
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseCreateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseResponse"
          description: Created release
      summary: Create release
      tags:
      - Releases
  /products/{product_id}/workflows:
    get:
      description: Get all workflows and their statuses for a product
      operationId: listProductWorkflows
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowsResponse"
          description: A list of workflows with statuses
      summary: List product workflows
      tags:
      - Workflows
  /releases/{release_id}:
    get:
      description: Get a specific release by ID
      operationId: getRelease
      parameters:
      - description: Release ID or reference number
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseResponse"
          description: Release details
      summary: Get release
      tags:
      - Releases
    put:
      description: Update an existing release
      operationId: updateRelease
      parameters:
      - description: Release ID or reference number
        explode: false
        in: path
        name: release_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseResponse"
          description: Updated release
      summary: Update release
      tags:
      - Releases
  /requirements/{requirement_id}:
    delete:
      description: Delete a requirement
      operationId: deleteRequirement
      parameters:
      - description: Requirement ID or reference number
        explode: false
        in: path
        name: requirement_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Requirement deleted
      summary: Delete requirement
      tags:
      - Requirements
    get:
      description: Get a specific requirement by ID or reference number
      operationId: getRequirement
      parameters:
      - description: Requirement ID or reference number
        explode: false
        in: path
        name: requirement_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"
          description: Requirement details
        "404":
          description: Requirement not found
      summary: Get requirement
      tags:
      - Requirements
    put:
      description: Update an existing requirement
      operationId: updateRequirement
      parameters:
      - description: Requirement ID or reference number
        explode: false
        in: path
        name: requirement_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"
          description: Updated requirement
      summary: Update requirement
      tags:
      - Requirements
  /features/{feature_id}/requirements:
    get:
      description: Get all requirements for a feature
      operationId: listFeatureRequirements
      parameters:
      - description: Feature ID or reference number
        explode: false
        in: path
        name: feature_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementsResponse"
          description: A list of requirements
      summary: List feature requirements
      tags:
      - Requirements
    post:
      description: Create a new requirement for a feature
      operationId: createFeatureRequirement
      parameters:
      - description: Feature ID or reference number
        explode: false
        in: path
        name: feature_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementCreateRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementResponse"
          description: Created requirement
      summary: Create requirement for feature
      tags:
      - Requirements
  /comments/{comment_id}:
    delete:
      description: Delete a comment
      operationId: deleteComment
      parameters:
      - description: Comment ID
        explode: false
        in: path
        name: comment_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Comment deleted
      summary: Delete comment
      tags:
      - Comments
    get:
      description: Get a specific comment by ID
      operationId: getComment
      parameters:
      - description: Numeric ID of the comment
        explode: false
        in: path
        name: comment_id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
          description: Comment details
        "404":
          description: Comment not found
      summary: Get comment
      tags:
      - Comments
    put:
      description: Update an existing comment
      operationId: updateComment
      parameters:
      - description: Numeric ID of the comment
        explode: false
        in: path
        name: comment_id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
          description: Updated comment
      summary: Update comment
      tags:
      - Comments
  /products/{product_id}/comments:
    get:
      description: Get all comments in a product
      operationId: listProductComments
      parameters:
      - description: Product ID or reference prefix
        explode: false
        in: path
        name: product_id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: per_page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentsResponse"
          description: A list of comments
      summary: List comments in a product
      tags:
